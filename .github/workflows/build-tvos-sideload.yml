name: Build tvOS sideload IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-sideload-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build unsigned Apple TV IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prepare the pinned tvOS Flutter engine
        run: tvos/scripts/fetch_engine.sh

      - name: Install CocoaPods dependencies
        run: tvos/scripts/pod_install.sh

      - name: Archive for Apple TV without signing
        run: |
          xcodebuild archive \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/Plezy.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA for tvsign
        run: |
          app_path="$RUNNER_TEMP/Plezy.xcarchive/Products/Applications/Runner.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app_path" "$RUNNER_TEMP/ipa/Payload/Plezy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/Plezy-tvOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-tvos-ipa
          path: ${{ runner.temp }}/Plezy-tvOS.ipa
          if-no-files-found: error
          retention-days: 7
